<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOP npm stylesheet test page</title>
    <!-- The host's own utility classes and its own React Flow diagram, styled its own way -->
    <style>
      .flex { display: grid; gap: 9px; }
      .hidden { visibility: hidden; }
      .react-flow { background: rgb(1, 2, 3); width: 321px; height: 123px; position: static; }
      .react-flow__node { border: 3px dashed rgb(4, 5, 6); padding: 7px; }
      button { font-size: 19px; padding: 5px 11px; }
      h1 { margin: 21px 0; font-size: 31px; }
    </style>
    <script>
      // `?nop` adds the NOP npm stylesheet, so the same page can be compared with and without it
      if (new URLSearchParams(location.search).has('nop')) {
        document.write('<link rel="stylesheet" href="/lib/style.css" />');
      }
    </script>
  </head>
  <body>
    <h1>Host page</h1>
    <div id="hostFlex" class="flex"><span>a</span><span>b</span></div>
    <p id="hostHidden" class="hidden">hidden by the host</p>
    <div id="hostFlow" class="react-flow"><div id="hostNode" class="react-flow__node">host node</div></div>
    <button id="hostButton" type="button">Host button</button>
  </body>
</html>
