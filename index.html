<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOP Playground</title>
    <meta name="description" content="Interactive viewer for SideFX Houdini node networks on the web. Export networks from Houdini, embed them on any page and inspect them on desktop and mobile." />
    <!-- NOP icon (sources and variants in design/nop-icon/) -->
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta property="og:title" content="NOP" />
    <meta property="og:description" content="Interactive viewer for SideFX Houdini node networks on the web. Export networks from Houdini, embed them on any page and inspect them on desktop and mobile." />
    <!-- og:url and og:image (absolute URLs) are added at build time from VITE_SITE_URL, see vite.config.ts -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tester phase: keep the playground out of search engines; remove for the public release -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body class="bg-[#1e1e1e] text-neutral-100 antialiased selection:bg-amber-500/30">
    <div id="root"></div>
    <script type="module" src="/src/playground/main.tsx"></script>
  </body>
</html>
