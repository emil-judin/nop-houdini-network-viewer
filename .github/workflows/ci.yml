# Checks every push and pull request: typecheck, lint and both builds. Protect `main` with this
# workflow once the repository is public (Settings > Branches > require the "verify" check).
# Actions are pinned to full commit SHAs (Dependabot keeps them current, see .github/dependabot.yml).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      # The library first: the playground build publishes its web component for the example site page
      - run: npm run build:lib
      - run: npm run build
