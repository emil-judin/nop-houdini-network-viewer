# Checks every push and pull request: typecheck, lint, unit and component tests, exporter tests,
# both builds, and browser tests. Protect `main` with this workflow once the repository is public
# (Settings > Branches > require the "verify" and "browser" checks).
# Actions are pinned to full commit SHAs (Dependabot keeps them current, see .github/dependabot.yml).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      # The library first: the playground build publishes its web component for the example site page
      - run: npm run build:lib
      # The third-party licenses must list exactly what the web component bundles
      - run: node scripts/build_third_party_notices.mjs --check
      - run: npm run build
      # After the builds: some unit tests check the built files (stylesheet scoping, no reference icons)
      - run: npm test
      - run: npm run test:exporter

  # Commit names on a pull request: type(area): summary (AGENTS.md section 5, decision 0016).
  # Dependabot's own subjects are set in .github/dependabot.yml.
  commits:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/lint_commits.mjs origin/${{ github.base_ref }}

  # Development runs React 19, and the peer range still allows React 18: run the unit and component
  # tests on React 18 as well. Without builds, the tests that check the built files skip themselves.
  react-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      # `npm ls` would report these versions as invalid against package.json, so check them directly
      - run: node -e "for (const p of ['react', 'react-dom']) { const v = require(p + '/package.json').version; console.log(p, v); if (!v.startsWith('18.')) process.exit(1); }"
      - run: npm test

  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
